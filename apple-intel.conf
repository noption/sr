# ---------- 其余 Apple 全家桶统一走美国 (绝不能一半直连一半代理) ----------
DOMAIN-SUFFIX,apple.com,🤖 Apple 智能
DOMAIN-SUFFIX,icloud.com,🤖 Apple 智能
DOMAIN-SUFFIX,icloud-content.com,🤖 Apple 智能
DOMAIN-SUFFIX,mzstatic.com,🤖 Apple 智能

# ---------- 其他 ----------
GEOIP,CN,DIRECT
FINAL,PROXY

[Host]
localhost = 127.0.0.1
*.local = server:system

[URL Rewrite]
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
# 不要对 *.apple.com / *.icloud.com 开 MITM, 苹果系统会拒绝被中间人
