DOMAIN-KEYWORD,guzzoni,🤖 Apple 智能

# ---------- ChatGPT 集成 (Apple 智能里调 ChatGPT, 必须走美国) ----------
DOMAIN-SUFFIX,chatgpt.com,🤖 Apple 智能
DOMAIN-SUFFIX,chat.openai.com,🤖 Apple 智能
DOMAIN-SUFFIX,openai.com,🤖 Apple 智能
